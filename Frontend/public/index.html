<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinica AI • Healthcare Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', system-ui; }
    .hero-section { background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%); color: white; padding: 60px 0; border-radius: 0 0 20px 20px; }
    .symptom-badge { cursor: pointer; font-size: 0.9rem; margin: 3px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { useState, useEffect } = React;
  const API_URL = '/api';

  const App = () => {
    const [activeTab, setActiveTab] = useState('home');
    const [symptoms, setSymptoms] = useState([]);
    const [selectedSymptoms, setSelectedSymptoms] = useState([]);
    const [prediction, setPrediction] = useState(null);

    useEffect(() => {
      fetch(`${API_URL}/symptoms`)
        .then(res => res.json())
        .then(data => setSymptoms(data.symptoms || []))
        .catch(err => console.log(err));
    }, []);

    const toggleSymptom = (sym) => {
      if (selectedSymptoms.includes(sym)) {
        setSelectedSymptoms(selectedSymptoms.filter(s => s !== sym));
      } else {
        setSelectedSymptoms([...selectedSymptoms, sym]);
      }
    };

    const handlePredict = async () => {
      if (!selectedSymptoms.length) return;
      const res = await fetch(`${API_URL}/predict`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ symptoms: selectedSymptoms })
      });
      const data = await res.json();
      setPrediction(data);
    };

    return (
      <div className="min-vh-100 d-flex flex-column">
        <nav className="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
          <div className="container">
            <a className="navbar-brand fw-bold" href="#"><i className="fas fa-heartpulse text-primary me-2"></i>Clinica AI</a>
            <div className="navbar-nav ms-auto">
              <button className={`nav-link btn btn-link ${activeTab === 'home' ? 'active text-white' : ''}`} onClick={() => setActiveTab('home')}>Home</button>
              <button className={`nav-link btn btn-link ${activeTab === 'checker' ? 'active text-white' : ''}`} onClick={() => setActiveTab('checker')}>Symptom Checker</button>
            </div>
          </div>
        </nav>

        <main className="flex-grow-1">
          {activeTab === 'home' && (
            <div className="hero-section text-center">
              <div className="container">
                <h1 className="display-4 fw-bold">AI-Powered Healthcare Diagnostic Platform</h1>
                <p className="lead mt-3">Machine learning disease prediction, medical recommendations, and patient portal.</p>
                <button className="btn btn-light btn-lg fw-bold text-primary mt-3" onClick={() => setActiveTab('checker')}>Start Symptom Checker</button>
              </div>
            </div>
          )}

          {activeTab === 'checker' && (
            <div className="container my-4">
              <div className="card shadow border-0 p-4">
                <h3 className="mb-3"><i className="fas fa-stethoscope text-primary me-2"></i>Symptom Checker</h3>
                <div className="mb-3">
                  <label className="fw-bold mb-2">Select Symptoms:</label>
                  <div className="p-3 border rounded bg-light" style={{maxHeight: '200px', overflowY: 'auto'}}>
                    {symptoms.map(s => (
                      <span
                        key={s}
                        className={`badge symptom-badge p-2 ${selectedSymptoms.includes(s) ? 'bg-primary' : 'bg-secondary'}`}
                        onClick={() => toggleSymptom(s)}
                      >
                        {s.replace(/_/g, ' ')}
                      </span>
                    ))}
                  </div>
                </div>
                <button className="btn btn-primary btn-lg w-100 fw-bold" onClick={handlePredict} disabled={!selectedSymptoms.length}>Predict Condition</button>

                {prediction && prediction.predictions && (
                  <div className="mt-4 p-3 border rounded bg-white">
                    <h4 className="text-success fw-bold">Top Prediction: {prediction.predictions[0].disease} ({prediction.predictions[0].probability}%)</h4>
                    <p className="text-muted">{prediction.predictions[0].description}</p>
                  </div>
                )}
              </div>
            </div>
          )}
        </main>
      </div>
    );
  };

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
